name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: "등록 여부·직전 버전 검수 대기 판정을 무시하고 패키지 제출(반려 뒤 재제출 · 보류분 제출 · 태그 ref에서 실행)"
        required: false
        default: false
        type: boolean

# 릴리스 생성(태그 푸시 시)에 필요한 쓰기 권한
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64 make python3

      - name: Build (x64 + x86)
        run: make

      - name: Verify size budget (초경량 회귀 검사)
        run: |
          ls -la dist/
          for f in dist/*.exe; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            if [ "$size" -gt 8192 ]; then
              echo "::error::$f 가 8KB를 초과했습니다 ($size bytes) — 초경량 원칙 위반"
              exit 1
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nShiftSpace
          path: dist/*.exe

      - name: Package (exe별 zip 압축)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist
          for f in *.exe; do
            zip -9 "${f%.exe}.zip" "$f"
          done
          ls -la *.zip

      - name: Release (태그 푸시 시 zip 첨부)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

  # 패키지 게시 판정: 같은 버전이 이미 등록(또는 제출되어 검수 중)이면 그 패키지는 게시에서 제외하고 릴리스만 처리한다.
  # 기본 방식은 nexa-dir3·nexa-sql의 publish-windows-packages guard 잡을 따른다.
  # | 채널 | 이미 있음 판정 |
  # | Chocolatey | 피드에 Id+Version 항목이 있다(승인됨·검수 중 모두 <entry>로 돌아온다) |
  # | winget | microsoft/winget-pkgs에 manifests/s/SosomLab/<패키지>/<버전> 이 병합돼 있거나, 그 버전 제목의 열린 PR이 있다 |
  # 직전 버전이 아직 검수 대기 중이면 새 버전도 보류한다(nexa-sql 방식 · 큐 엉킴 방지).
  # | Chocolatey | 현재보다 앞선 정식 태그 중 하나라도 피드 상태가 PackageStatus=Submitted 다(승인·반려·미제출은 막지 않는다) |
  # | winget | 같은 식별자의 다른 버전 PR이 열려 있다 |
  # 조회 자체가 실패하면 중복 제출을 피하려고 제외 쪽으로 판정한다. 수동 실행 force=true 는 판정을 무시한다.
  guard:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      choco: ${{ steps.choco.outputs.go }}
      choco_led: ${{ steps.choco.outputs.go_led }}
      winget: ${{ steps.winget.outputs.go }}
      winget_led: ${{ steps.winget.outputs.go_led }}
    env:
      VERSION: ${{ github.ref_name }}
      FORCE: ${{ inputs.force || false }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # choco 직전 버전 판정 = 앞선 태그 목록

      - id: choco
        name: Chocolatey 등록 여부
        shell: bash
        run: |
          set -uo pipefail
          v="${VERSION#v}"
          check() {
            local pkg="$1"
            if [ "$FORCE" = "true" ]; then echo "choco: $pkg — force=true, 판정 생략" >&2; echo true; return; fi
            local url="https://community.chocolatey.org/api/v2/Packages()?\$filter=Id%20eq%20'$pkg'%20and%20Version%20eq%20'$v'"
            local body
            if ! body=$(curl -fsS --retry 3 "$url"); then
              echo "::warning::choco: $pkg 조회 실패 — 이번에는 게시에서 제외한다." >&2; echo false; return
            fi
            if echo "$body" | grep -q '<entry>'; then
              if echo "$body" | grep -q '<d:IsApproved m:type="Edm.Boolean">true</d:IsApproved>'; then st="승인됨"; else st="검수 중 또는 반려"; fi
              echo "::notice::choco: $pkg $v 이(가) 이미 등록되어 있다($st) — 게시에서 제외한다." >&2; echo false; return
            fi
            # 앞선 정식 태그 가운데 검수 대기(Submitted)인 버전이 있으면 보류.
            local t pv b2 pending=""
            for t in $(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' | grep -vx "$VERSION"); do
              pv="${t#v}"
              [ "$(printf '%s\n' "$pv" "$v" | sort -V | head -1)" = "$pv" ] || continue  # 현재보다 높은 태그는 무시
              url="https://community.chocolatey.org/api/v2/Packages()?\$filter=Id%20eq%20'$pkg'%20and%20Version%20eq%20'$pv'"
              if ! b2=$(curl -fsS --retry 3 "$url"); then
                echo "::warning::choco: $pkg $pv 조회 실패 — 이번에는 게시에서 제외한다." >&2; echo false; return
              fi
              if echo "$b2" | grep -q '<d:PackageStatus>Submitted</d:PackageStatus>'; then pending="$pending $pv"; fi
            done
            if [ -n "$pending" ]; then
              echo "::warning::choco: $pkg 직전 버전(${pending# })이 검수 대기 중 — $v 은(는) 보류한다. 승인 뒤 force=true 수동 실행으로 제출." >&2; echo false; return
            fi
            echo "choco: $pkg $v 미등록 · 대기 중인 직전 버전 없음 — 게시한다." >&2; echo true
          }
          echo "go=$(check nshiftspace)" >> "$GITHUB_OUTPUT"
          echo "go_led=$(check nshiftspace-led)" >> "$GITHUB_OUTPUT"

      - id: winget
        name: winget 등록 여부
        shell: bash
        run: |
          set -uo pipefail
          v="${VERSION#v}"
          check() {
            local id="$1" sub="${1#SosomLab.}"; sub="${sub//./\/}"   # SosomLab.nShiftSpace.LED → nShiftSpace/LED
            if [ "$FORCE" = "true" ]; then echo "winget: $id — force=true, 판정 생략" >&2; echo true; return; fi
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/s/SosomLab/$sub/$v")
            if [ "$code" = "200" ]; then
              echo "::notice::winget: $id $v 이(가) 이미 winget-pkgs에 병합되어 있다 — 게시에서 제외한다." >&2; echo false; return
            elif [ "$code" != "404" ]; then
              echo "::warning::winget: $id 조회 실패(HTTP $code) — 이번에는 게시에서 제외한다." >&2; echo false; return
            fi
            local titles
            if ! titles=$(gh api -X GET search/issues -f q="repo:microsoft/winget-pkgs is:pr is:open \"$id\" in:title" \
                            -q '.items[] | "#\(.number) \(.title)"'); then
              echo "::warning::winget: $id PR 검색 실패 — 이번에는 게시에서 제외한다." >&2; echo false; return
            fi
            # 제목에 "<id> <버전>" 또는 "<id> version <버전>" 이 정확히 있어야 한다(.LED 와 섞이지 않게 고정 문자열로 비교).
            local hit
            hit=$(echo "$titles" | grep -F -e "$id $v" -e "$id version $v" || true)
            if [ -n "$hit" ]; then
              echo "::notice::winget: $id $v 제출 PR이 이미 열려 있다 — 게시에서 제외한다." >&2; echo "$hit" >&2; echo false; return
            fi
            # 같은 식별자의 다른 버전 PR이 열려 있으면 보류. "<id> " 또는 "<id> version " 뒤에 숫자가 와야 한다(식별자 바로 뒤 공백이 .LED 를 걸러낸다).
            local pend
            pend=$(echo "$titles" | grep -E "(^|[ :])$id (version )?[0-9]" || true)
            if [ -n "$pend" ]; then
              echo "::warning::winget: $id 직전 버전 PR이 검수 대기 중 — $v 은(는) 보류한다. 병합 뒤 force=true 수동 실행으로 제출." >&2; echo "$pend" >&2; echo false; return
            fi
            echo "winget: $id $v 미등록 · 열린 PR 없음 — 게시한다." >&2; echo true
          }
          echo "go=$(check SosomLab.nShiftSpace)" >> "$GITHUB_OUTPUT"
          echo "go_led=$(check SosomLab.nShiftSpace.LED)" >> "$GITHUB_OUTPUT"

  # 태그 배포 시 Chocolatey 커뮤니티 저장소에 자동 게시.
  # 저장소 시크릿 CHOCO_API_KEY 가 등록되어 있어야 실제 push 됨 (없으면 pack까지만).
  chocolatey:
    needs: guard
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    env:
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare package (버전·체크섬 주입)
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $base = 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}'
          Invoke-WebRequest "$base/nShiftSpace-x86.zip" -OutFile x86.zip
          Invoke-WebRequest "$base/nShiftSpace-x64.zip" -OutFile x64.zip
          $sum32 = (Get-FileHash x86.zip -Algorithm SHA256).Hash.ToLower()
          $sum64 = (Get-FileHash x64.zip -Algorithm SHA256).Hash.ToLower()
          $dir = 'packaging/chocolatey'
          (Get-Content "$dir/nshiftspace.nuspec" -Raw) -replace '__VERSION__', $version |
            Set-Content "$dir/nshiftspace.nuspec"
          (Get-Content "$dir/tools/chocolateyinstall.ps1" -Raw) `
            -replace '__VERSION__', $version `
            -replace '__CHECKSUM32__', $sum32 `
            -replace '__CHECKSUM64__', $sum64 |
            Set-Content "$dir/tools/chocolateyinstall.ps1"

      - name: choco pack
        shell: pwsh
        run: choco pack packaging/chocolatey/nshiftspace.nuspec --outputdirectory .

      - name: choco push (미등록 버전만)
        if: env.CHOCO_API_KEY != '' && needs.guard.outputs.choco == 'true'
        shell: pwsh
        run: choco push (Get-Item nshiftspace.*.nupkg).FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: chocolatey-package
          path: nshiftspace.*.nupkg

  # LED판은 별도 패키지 nshiftspace-led 로 게시 (기존 nshiftspace 는 일반판 그대로).
  chocolatey-led:
    needs: guard
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    env:
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare package (버전·체크섬 주입)
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $base = 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}'
          Invoke-WebRequest "$base/nShiftSpace-led-x86.zip" -OutFile x86.zip
          Invoke-WebRequest "$base/nShiftSpace-led-x64.zip" -OutFile x64.zip
          $sum32 = (Get-FileHash x86.zip -Algorithm SHA256).Hash.ToLower()
          $sum64 = (Get-FileHash x64.zip -Algorithm SHA256).Hash.ToLower()
          $dir = 'packaging/chocolatey-led'
          (Get-Content "$dir/nshiftspace-led.nuspec" -Raw) -replace '__VERSION__', $version |
            Set-Content "$dir/nshiftspace-led.nuspec"
          (Get-Content "$dir/tools/chocolateyinstall.ps1" -Raw) `
            -replace '__VERSION__', $version `
            -replace '__CHECKSUM32__', $sum32 `
            -replace '__CHECKSUM64__', $sum64 |
            Set-Content "$dir/tools/chocolateyinstall.ps1"

      - name: choco pack
        shell: pwsh
        run: choco pack packaging/chocolatey-led/nshiftspace-led.nuspec --outputdirectory .

      - name: choco push (미등록 버전만)
        if: env.CHOCO_API_KEY != '' && needs.guard.outputs.choco_led == 'true'
        shell: pwsh
        run: choco push (Get-Item nshiftspace-led.*.nupkg).FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: chocolatey-led-package
          path: nshiftspace-led.*.nupkg

  # 태그 배포 시 winget-pkgs 매니페스트 PR 자동 제출 (일반판 + LED판).
  # 방식: 저장소의 TEMPLATE.*.yaml 에 버전·SHA256·날짜를 주입해 매니페스트를 만들고 `wingetcreate submit` 으로 PR 생성.
  #   v0.2.0·v0.3.0 교훈: `wingetcreate update` 는 zip+중첩 포터블 패키지의 URL을 아키텍처별 설치 항목에 짝짓지 못해
  #   "Nested installer not found in zip archive: nShiftSpace-x86.exe" 로 실패한다 (|x64 지정으로도 동일). submit 은 완성된
  #   매니페스트 폴더를 그대로 올리므로 이 문제가 없다.
  # guard 잡이 이미 등록(병합 또는 열린 PR)된 버전으로 판정한 패키지는 제출하지 않는다(매니페스트 렌더·아티팩트는 계속 남긴다).
  # WINGET_TOKEN: public_repo 권한의 GitHub PAT (없으면 잡 스킵). 생성된 매니페스트는 아티팩트로도 남긴다.
  winget:
    needs: guard
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Render manifests (버전·SHA256·날짜 주입)
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $base = 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}'
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $pkgs = @(
            @{ id = 'SosomLab.nShiftSpace';     x64 = 'nShiftSpace-x64.zip';     x86 = 'nShiftSpace-x86.zip' },
            @{ id = 'SosomLab.nShiftSpace.LED'; x64 = 'nShiftSpace-led-x64.zip'; x86 = 'nShiftSpace-led-x86.zip' }
          )
          foreach ($p in $pkgs) {
            # 식별자의 점은 폴더 구분: SosomLab.nShiftSpace.LED → manifests/s/SosomLab/nShiftSpace/LED
            $dir = "packaging/winget/manifests/s/SosomLab/$(($p.id -replace '^SosomLab\.','') -replace '\.','/')"
            Invoke-WebRequest "$base/$($p.x64)" -OutFile x64.zip
            Invoke-WebRequest "$base/$($p.x86)" -OutFile x86.zip
            $sha64 = (Get-FileHash x64.zip -Algorithm SHA256).Hash.ToUpper()
            $sha32 = (Get-FileHash x86.zip -Algorithm SHA256).Hash.ToUpper()
            $out = "rendered/$($p.id)/$version"
            New-Item -ItemType Directory -Force $out | Out-Null
            foreach ($t in Get-ChildItem "$dir/TEMPLATE*.yaml") {
              $name = $t.Name -replace '^TEMPLATE', $p.id
              (Get-Content $t.FullName -Raw) `
                -replace '__VERSION__', $version `
                -replace '__DATE__', $date `
                -replace '__SHA64__', $sha64 `
                -replace '__SHA32__', $sha32 |
                Set-Content "$out/$name" -NoNewline
            }
            Get-ChildItem $out | ForEach-Object { Write-Host "rendered $($_.FullName)" }
          }

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: rendered/

      - name: Submit PRs (wingetcreate submit · 미등록 버전만)
        if: env.WINGET_TOKEN != '' && (needs.guard.outputs.winget == 'true' || needs.guard.outputs.winget_led == 'true')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $ids = @()
          if ('${{ needs.guard.outputs.winget }}' -eq 'true')     { $ids += 'SosomLab.nShiftSpace' }
          if ('${{ needs.guard.outputs.winget_led }}' -eq 'true') { $ids += 'SosomLab.nShiftSpace.LED' }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $failed = 0
          foreach ($id in $ids) {
            $dir = "rendered/$id/$version"
            Write-Host "== submit $id $version"
            ./wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "New version: $id version $version" $dir
            if ($LASTEXITCODE -ne 0) { Write-Warning "submit failed: $id"; $failed++ }
          }
          if ($failed -gt 0) { exit 1 }
